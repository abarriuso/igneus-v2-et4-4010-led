<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Igneus V2 ET4 — 3D visualizer</title>
<style>
  :root { --bg: #111214; --panel: #1b1d21; --line: #2c2f35; --text: #e8e9eb; --muted: #9aa0a8; --accent: #f2a43a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel); }
  h1 { font-size: 17px; margin: 0; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 14px; font: inherit; cursor: pointer; }
  .tabs button.on { background: var(--accent); border-color: var(--accent); color: #1a1205; font-weight: 600; }
  .desc { color: var(--muted); font-size: 13.5px; flex: 1 1 260px; }
  nav { display: flex; gap: 16px; font-size: 14px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
  footer { padding: 8px 16px; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); background: var(--panel); }
</style>
</head>
<body>
<header>
  <h1>Igneus V2 for the Anet ET4 <span>· 4010 blowers and LED light</span></h1>
  <div class="tabs" role="tablist">
    <button role="tab" data-v="normal">Normal</button>
    <button role="tab" data-v="flat">Flat</button>
  </div>
  <div class="desc" id="desc"></div>
  <nav>
    <a href="../generator/">Generator</a>
    <a href="../#downloads">Downloads</a>
    <a href="https://github.com/abarriuso/igneus-v2-et4-4010-led">GitHub</a>
  </nav>
</header>
<iframe id="view" title="Interactive 3D assembly" allow="fullscreen"></iframe>
<footer>
  Remix of <a href="https://www.thingiverse.com/thing:4178590">IGNEUS V2 by Locos3D</a>, including meshes of the original parts,
  under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC BY-NC-SA 4.0</a>. Drag to rotate, scroll or pinch to zoom.
</footer>
<script>
  const PAGES = {
    normal: { src: 'normal.html', desc: 'The 4010 blowers sit in the original position, held by their mounting screw.' },
    flat: { src: 'flat.html', desc: 'The 4010 blowers sit on top of the adapters with the intake facing the front.' },
  };
  const view = document.getElementById('view');
  function show(v) {
    if (!PAGES[v]) v = 'normal';
    view.src = PAGES[v].src;
    document.getElementById('desc').textContent = PAGES[v].desc;
    document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
    history.replaceState(null, '', '#' + v);
  }
  document.querySelector('.tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.v); });
  show(location.hash.slice(1));
</script>
</body>
</html>
